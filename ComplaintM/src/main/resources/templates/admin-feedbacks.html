<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Admin Feedbacks | Campus Assist</title>
  <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo">CS</div>
        <div>
          <div class="title">Campus Assist</div>
          <div style="font-size:12px;color:#eaf2ff">Admin Panel</div>
        </div>
      </div>
      <div class="header-right">
        <div th:text="${admin.name}" style="font-weight:600">Admin</div>
        <button class="btn" onclick="window.location.href='/admin/logout'">Logout</button>
      </div>
    </div>

    <!-- Top Section -->
    <div class="top-panel">
      <div class="welcome">
        <h2>Feedbacks for <span th:text="${admin.department}">Hostel</span> Department</h2>
        <p>Here you can view feedback submitted by students for resolved complaints.</p>
      </div>
      <div class="action-area">
        <a th:href="@{/admin/dashboard}" class="resolve-link">Back to Dashboard</a>
      </div>
    </div>

    <!-- Feedback Cards -->
    <div class="cards" style="margin-top:20px;">
      <div class="card" th:each="f : ${feedbacks}">
         <div class="card-left">
	    <div th:if="${!f.complaint.anonymous}">
	      <div><strong th:text="${f.student.name}">Student Name</strong></div>
	      <div th:text="${f.student.rollNumber}">Roll</div>
	    </div>
	    <div th:if="${f.complaint.anonymous}" style="font-style:italic;color:var(--muted)">
	      Anonymous
	    </div>
	
	    <div style="font-size:13px;color:var(--muted)" 
	         th:text="${#temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm')}">
	      2025-11-01
	    </div>
	  </div>

        <div class="card-center">
          <div class="complaint-title" th:text="${f.complaint.title}">
            Complaint Title
          </div>
          <div style="font-size:14px;color:var(--muted)" th:text="'Rating: ' + ${f.rating} + ' ★'"></div>
          <div class="complaint-desc" th:text="${f.comment != null ? f.comment : 'No comment provided.'}">
            Comment here...
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div th:if="${#lists.isEmpty(feedbacks)}" 
           style="margin-top:40px;text-align:center;color:var(--muted)">
        No feedbacks available yet for this department.
      </div>
    </div>

  </div>
</body>
</html>
