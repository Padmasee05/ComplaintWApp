<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | Complaint Management System</title>
  <link rel="stylesheet" th:href="@{/css/admin-login.css}">
  
</head>

<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <p class="sub">Sign in to manage complaints</p>

    <p th:if="${error}" th:text="${error}" class="error"></p>

    <form th:action="@{/admin/login}" method="post">
      <input type="email" name="email" placeholder="Admin Email" required>
		<div class="password-wrapper">
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
        </div>
      <button type="submit">Login</button>
    </form>

	<p style="text-align:center; margin-top:10px;">
  <a th:href="@{/login}" style="color:#0056b3; text-decoration:underline;">Login as Student</a>
</p>

  </div>
  <script>
function togglePassword(fieldId, button) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        button.textContent = "🙈";
    } else {
        field.type = "password";
        button.textContent = "👁️";
    }
}
</script>
</body>
</html>
