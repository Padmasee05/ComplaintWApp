<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Student Login</h2>

    <!-- Show error if login failed -->
    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <form th:action="@{/students/login}" method="post">
        <input type="email" name="email" placeholder="Email" required><br>
		<div class="password-wrapper">
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
        </div>        
        <button type="submit">Login</button>
    </form>

    <p>Don’t have an account? <a th:href="@{/register}">Register here</a></p>
    
	   <div class="switch-login">
		  <p style="text-align:center; margin-top:10px;">
		  <a th:href="@{/admin/login}" style="color:#0056b3; text-decoration:underline;">Login as Admin</a>
		</p>

		</div>

	</div>
<script>
function togglePassword(fieldId, button) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        button.textContent = "🙈";
    } else {
        field.type = "password";
        button.textContent = "👁️";
    }
}
</script>
</body>
</html>
