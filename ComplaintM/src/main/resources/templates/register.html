<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Student Registration</h2>
	<form th:action="@{/register}" method="post" th:object="${student}">
	<div th:if="${errorMessage}" class="error">
	  <p th:text="${errorMessage}"></p>
	</div>
    <input type="text" th:field="*{name}" placeholder="Full Name" required>
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></p>

    <input type="text" th:field="*{rollNumber}" placeholder="Roll Number" required>
    <p th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}" class="error"></p>

    <input type="email" th:field="*{email}" placeholder="Email" required>
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></p>

    <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number" required>
    <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error"></p>

    <input type="text" th:field="*{department}" placeholder="Department" required>
    <p th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></p>

    <input type="text" th:field="*{hostel}" placeholder="Hostel" required>
    <p th:if="${#fields.hasErrors('hostel')}" th:errors="*{hostel}" class="error"></p>
 	<div class="password-wrapper">
            <input type="password" id="password" th:field="*{password}"
       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
       title="At least 8 chars, with uppercase, lowercase, number, and special character"
       placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
        </div>
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></p>
	<br><br>
    <button type="submit">Register</button>
</form>


    <p>Already registered? <a th:href="@{/login}">Login here</a></p>
</div>
<script>
function togglePassword(fieldId, button) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        button.textContent = "🙈"; // show open-eye
    } else {
        field.type = "password";
        button.textContent = "👁️"; // show closed-eye
    }
}
</script>
</body>
</html>
