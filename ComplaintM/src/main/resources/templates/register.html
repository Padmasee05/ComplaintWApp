<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Student Registration</h2>
	<form th:action="@{/register}" method="post" th:object="${student}">
        <input type="text" th:field="*{name}" placeholder="Full Name" required><br>
        <input type="text" th:field="*{rollNumber}" placeholder="Roll Number" required><br>
        <input type="email" th:field="*{email}" placeholder="Email" required><br>
        <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number"><br>
        
        <input type="text" th:field="*{department}" placeholder="Department" required><br>
        <input type="text" th:field="*{hostel}" placeholder="Hostel" required><br>

        <input type="password" th:field="*{password}" placeholder="Password" required><br>
        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a th:href="@{/login}">Login here</a></p>
</div>
</body>
</html>
