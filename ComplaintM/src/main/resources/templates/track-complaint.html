<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Track Complaint</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/track-complaint.css}">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Include header -->
  <div th:replace="fragments/header :: header"></div>

  <div class="dashboard-container">
    <!-- Include sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="content-area">
      <div class="track-container">
        <h2>Track Your Complaints</h2>

        <!-- 🔍 Search Bar -->
        <div class="search-filter">
          <input type="text" id="searchInput" placeholder="Search complaints..." />
          
          <div class="filter-buttons">
            <button class="filter-btn active" id="allBtn">All Complaints</button>
            <button class="filter-btn" id="pendingBtn">Pending</button>
            <button class="filter-btn" id="resolvedBtn">Resolved</button>
            <button class="filter-btn" id="deletePendingBtn">Delete Pending</button>
          </div>
        </div>

        <!-- 📋 All Complaints Table -->
        <div id="allComplaintsTable" class="complaint-table">
          <h3>All Complaints</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="complaint : ${userComplaints}">
                <td th:text="${complaint.id}"></td>
                <td th:text="${complaint.title}"></td>
                <td th:text="${complaint.category}"></td>
                <td th:text="${complaint.status}"></td>
                <td th:text="${#temporals.format(complaint.updatedAt, 'dd MMM yyyy HH:mm')}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 🕓 Pending Complaints Table -->
        <div id="pendingComplaintsTable" class="complaint-table hidden">
          <h3>Pending Complaints</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Updated</th>
                 <th class="delete-col hidden">Action</th> 
              </tr>
            </thead>
            <tbody>
              <tr th:each="complaint : ${userComplaints}"
                  th:if="${complaint.status.equalsIgnoreCase('Pending')}">
                <td th:text="${complaint.id}"></td>
                <td th:text="${complaint.title}"></td>
                <td th:text="${complaint.category}"></td>
                <td th:text="${#temporals.format(complaint.updatedAt, 'dd MMM yyyy HH:mm')}"></td>
             	<td class="delete-col hidden">
			      <button class="delete-btn" th:data-id="${complaint.id}">🗑️ Delete</button>
			    </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- ✅ Resolved Complaints Table -->
        <div id="resolvedComplaintsTable" class="complaint-table hidden">
          <h3>Resolved Complaints</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="complaint : ${userComplaints}"
                  th:if="${complaint.status.equalsIgnoreCase('Resolved')}">
                <td th:text="${complaint.id}"></td>
                <td th:text="${complaint.title}"></td>
                <td th:text="${complaint.category}"></td>
                <td th:text="${#temporals.format(complaint.updatedAt, 'dd MMM yyyy HH:mm')}"></td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script>
const allBtn = document.getElementById("allBtn");
const pendingBtn = document.getElementById("pendingBtn");
const resolvedBtn = document.getElementById("resolvedBtn");
const deletePendingBtn = document.getElementById("deletePendingBtn");

const allTable = document.getElementById("allComplaintsTable");
const pendingTable = document.getElementById("pendingComplaintsTable");
const resolvedTable = document.getElementById("resolvedComplaintsTable");

const searchInput = document.getElementById("searchInput");

let activeType = "all";
let deleteMode = false; // 🔹 tracks if delete mode is active

function showTable(type) {
  activeType = type;
  deleteMode = (type === "deletePending");

  // hide all tables
  allTable.classList.add("hidden");
  pendingTable.classList.add("hidden");
  resolvedTable.classList.add("hidden");

  // reset button states
  [allBtn, pendingBtn, resolvedBtn, deletePendingBtn].forEach(btn => btn.classList.remove("active"));

  if (type === "all") {
    allTable.classList.remove("hidden");
    allBtn.classList.add("active");
  } else if (type === "pending") {
    pendingTable.classList.remove("hidden");
    pendingBtn.classList.add("active");
  } else if (type === "resolved") {
    resolvedTable.classList.remove("hidden");
    resolvedBtn.classList.add("active");
  } else if (type === "deletePending") {
    pendingTable.classList.remove("hidden");
    deletePendingBtn.classList.add("active");
  }

  // toggle delete column visibility
  toggleDeleteColumn(deleteMode);

  applySearchFilter();
}

function toggleDeleteColumn(show) {
  document.querySelectorAll(".delete-col").forEach(col => {
    col.classList.toggle("hidden", !show);
  });
}

// 🔹 Delete button logic (frontend only)
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("delete-btn")) {
    const row = e.target.closest("tr");
    const id = e.target.getAttribute("data-id");

    Swal.fire({
      title: "Are you sure?",
      text: `Do you want to delete complaint #${id}?`,
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#e74c3c",
      cancelButtonColor: "#3085d6",
      confirmButtonText: "Yes, delete it!"
    }).then(result => {
      if (result.isConfirmed) {
        row.remove(); // ✅ frontend delete for now
        Swal.fire("Deleted!", "Your complaint has been removed.", "success");
      }
    });
  }
});

// 🔍 Search filtering
function applySearchFilter() {
  const filter = searchInput.value.toLowerCase();

  const visibleTable =
    activeType === "all"
      ? allTable
      : activeType === "pending" || activeType === "deletePending"
      ? pendingTable
      : resolvedTable;

  visibleTable.querySelectorAll("tbody tr").forEach(row => {
    const match = row.textContent.toLowerCase().includes(filter);
    row.style.display = match ? "" : "none";
  });
}

// 🔹 Button events
allBtn.addEventListener("click", () => showTable("all"));
pendingBtn.addEventListener("click", () => showTable("pending"));
resolvedBtn.addEventListener("click", () => showTable("resolved"));
deletePendingBtn.addEventListener("click", () => showTable("deletePending"));
searchInput.addEventListener("keyup", applySearchFilter);
</script>

</body>
</html>
